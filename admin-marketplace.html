  <style>
    /* Brand typography: Fraunces for page titles, Inter for everything else */
    body { font-family: 'Inter', system-ui, sans-serif; }
    .font-brand { font-family: 'Fraunces', Georgia, serif; }

    /* Toast slide-in/out animation */
    .toast-enter { animation: toastIn .4s cubic-bezier(.16,1,.3,1); }
    .toast-exit { animation: toastOut .4s cubic-bezier(.6,.02,.7,1) forwards; }
    @keyframes toastIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes toastOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(120%); opacity: 0; } }

    /* Modal backdrop + panel transitions */
    .modal-overlay { transition: opacity .25s ease; }
    .modal-panel { transition: transform .25s cubic-bezier(.16,1,.3,1), opacity .25s ease; }

    /* Sidebar slide on mobile */
    .sidebar { transition: transform .3s cubic-bezier(.16,1,.3,1); }

    /* WYSIWYG toolbar button states */
    .fmt-btn:active, .fmt-btn.active { background: #292524; color: #fff; }

    /* Custom scrollbar for a cleaner look */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #d6d3d1; border-radius: 999px; }
    ::-webkit-scrollbar-track { background: transparent; }
  </style>

  /* ---------- DOM helpers ---------------------------------------- */
  const $ = (sel, root = document) => root.querySelector(sel);
  const el = (tag, attrs = {}, children = []) => {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'class') node.className = v;
      else if (k === 'html') node.innerHTML = v;
      else if (v !== null && v !== undefined) node.setAttribute(k, v);
    }
    // Recursively flatten nested arrays so renderTable can pass rows of cells
    const walk = (items) => {
      for (const c of items) {
        if (c == null) continue;
        if (Array.isArray(c)) { walk(c); continue; }
        node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      }
    };
    walk(children);
    return node;
  };

  /* ---------- Chart.js initialization ---------------------------- */
  let chartsInitialized = false;
  function initCharts() {
    if (chartsInitialized || typeof Chart === 'undefined') return;
    chartsInitialized = true;

    // Shared font config
    Chart.defaults.font.family = 'Inter';
    Chart.defaults.color = '#78716c';

    // Line chart — Escrow volume over 30 days
    const ctx1 = document.getElementById('revenueChart').getContext('2d');
    const grad = ctx1.createLinearGradient(0, 0, 0, 256);
    grad.addColorStop(0, 'rgba(13,148,136,0.25)');
    grad.addColorStop(1, 'rgba(13,148,136,0.0)');
    new Chart(ctx1, {
      type: 'line',
      data: {
        labels: ['D1', 'D5', 'D10', 'D15', 'D20', 'D25', 'D30'],
        datasets: [{
          label: 'Escrow Volume ($)',
          data: [18000, 22000, 19500, 27000, 31000, 28500, 38000],
          borderColor: '#0d9488',
          backgroundColor: grad,
          borderWidth: 2.5,
          fill: true,
          tension: 0.4,
          pointBackgroundColor: '#0d9488',
          pointRadius: 3,
          pointHoverRadius: 5,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ' $' + c.parsed.y.toLocaleString() } } },
        scales: {
          y: { beginAtZero: false, grid: { color: '#f5f5f4' }, ticks: { callback: (v) => '$' + (v / 1000) + 'k' } },
          x: { grid: { display: false }, ticks: { color: '#a8a29e' } },
        },
      },
    });

    // Doughnut chart — Lead sources
    new Chart(document.getElementById('leadChart'), {
      type: 'doughnut',
      data: {
        labels: ['Website', 'Google Ads', 'Referral', 'Social', 'Direct'],
        datasets: [{ data: [42, 26, 16, 11, 5], backgroundColor: ['#0d9488', '#0ea5e9', '#f59e0b', '#a855f7', '#78716c',], borderWidth: 0, hoverOffset: 6 }],
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '62%',
        plugins: { legend: { position: 'bottom', labels: { padding: 16, usePointStyle: true, pointStyle: 'circle' } }, tooltip: { callbacks: { label: (c) => ' ' + c.label + ': ' + c.parsed + '%' } } },
      },
    });
  }

  /* ================================================================
     MODAL — centralized open/close + form rendering
     ================================================================ */
  const modalOverlay = $('#modalOverlay');
  const modalTitle = $('#modalTitle');
  const modalForm = $('#modalForm');

  const formSchemas = {
    client: { title: 'New Client', fields: [
      { name: 'name', label: 'Full Name', type: 'text', required: true },
      { name: 'email', label: 'Email', type: 'email', required: true },
      { name: 'service', label: 'Service Type', type: 'select', options: ['Deep Clean', 'Standard Cleaning', 'Post-Construction', 'Office Cleaning'] },
      { name: 'city', label: 'City', type: 'text', required: true },
    ] },
    cleaner: { title: 'Add Cleaner', fields: [
      { name: 'name', label: 'Name', type: 'text', required: true },
      { name: 'company', label: 'Company', type: 'text' },
      { name: 'area', label: 'Service Area', type: 'text', required: true },
      { name: 'rating', label: 'Rating (1-5)', type: 'text' },
    ] },
    announcement: { title: 'New Announcement', fields: [
      { name: 'title', label: 'Title', type: 'text', required: true },
      { name: 'message', label: 'Message', type: 'textarea', required: true },
      { name: 'type', label: 'Type', type: 'select', options: ['Banner', 'Modal Popup'] },
    ] },
    user: { title: 'Invite New Admin', fields: [
      { name: 'name', label: 'Name', type: 'text', required: true },
      { name: 'email', label: 'Email', type: 'email', required: true },
      { name: 'role', label: 'Role', type: 'select', options: ['Super Admin', 'Content Editor', 'Support Agent'] },
    ] },
  };

  function openModal({ title, fields = [], body = null }) {
    modalTitle.textContent = title;
    modalForm.innerHTML = '';
    modalForm.dataset.panel = '';
    if (body) modalForm.appendChild(body);
    for (const f of fields) {
      const wrap = el('div', {});
      wrap.appendChild(el('label', { class: 'block text-sm font-medium text-stone-700 mb-1' }, [f.label]));
      if (f.type === 'select') {
        const sel = el('select', { name: f.name, class: 'w-full px-3 py-2.5 rounded-lg border border-stone-300 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-teal-600' });
        (f.options || []).forEach((o) => sel.appendChild(el('option', { value: o }, [o])));
        wrap.appendChild(sel);
      } else if (f.type === 'textarea') {
        wrap.appendChild(el('textarea', { name: f.name, rows: 3, placeholder: f.placeholder || '', class: 'w-full px-3 py-2.5 rounded-lg border border-stone-300 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-teal-600 resize-none' }));
      } else {
        const input = el('input', { name: f.name, type: f.type, placeholder: f.placeholder || '', class: 'w-full px-3 py-2.5 rounded-lg border border-stone-300 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600 focus:border-teal-600' });
        if (f.required) input.required = true;
        wrap.appendChild(input);
      }
      modalForm.appendChild(wrap);
    }
    modalOverlay.classList.remove('hidden');
    modalOverlay.classList.add('flex');
    const first = modalForm.querySelector('input, select, textarea');
    if (first) first.focus();
  }
  function closeModal() {
    modalOverlay.classList.add('hidden');
    modalOverlay.classList.remove('flex');
    modalForm.reset();
  }

  /* ================================================================
     TOAST — slide in, hold 3s, slide out
     ================================================================ */
  let toastTimer;
  function toast(message) {
    const toastEl = $('#toast');
    $('#toastMsg').textContent = message || 'Action completed successfully';
    toastEl.classList.remove('hidden', 'toast-exit');
    toastEl.classList.add('flex', 'toast-enter');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toastEl.classList.remove('toast-enter');
      toastEl.classList.add('toast-exit');
      setTimeout(() => { toastEl.classList.add('hidden'); toastEl.classList.remove('flex', 'toast-exit'); }, 400);
    }, 3000);
  }

  /* ================================================================
     EVENT WIRING
     ================================================================ */
  // Sidebar navigation
  document.querySelectorAll('.nav-item').forEach((btn) => btn.addEventListener('click', () => renderView(btn.dataset.panel)));

  // Delegated "create" buttons (Quick Action dropdown + in-view buttons)
  document.addEventListener('click', (e) => {
    const createBtn = e.target.closest('[data-create]');
    if (createBtn) {
      const key = createBtn.dataset.create;
      if (formSchemas[key]) openModal(formSchemas[key]);
    }
  });

  // Approve / Reject actions (delegated)
  view.addEventListener('click', (e) => {
    const approve = e.target.closest('[data-approve]');
    const reject = e.target.closest('[data-reject]');
    if (approve) { toast(`Cleaner "${approve.dataset.approve}" approved`); }
    if (reject) { toast(`Cleaner "${reject.dataset.reject}" rejected`); }
  });

  // Quick Action dropdown toggle
  const qaBtn = $('#quickActionBtn'), qaMenu = $('#quickActionMenu');
  qaBtn.addEventListener('click', (e) => { e.stopPropagation(); qaMenu.classList.toggle('hidden'); });
  document.addEventListener('click', (e) => { if (!qaBtn.contains(e.target) && !qaMenu.contains(e.target)) qaMenu.classList.add('hidden'); });

  // Modal controls
  $('#modalClose').addEventListener('click', closeModal);
  $('#modalCancel').addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

  // Modal form submit
  modalForm.addEventListener('submit', (e) => {
    e.preventDefault();
    const data = {};
    modalForm.querySelectorAll('input, select, textarea').forEach((inp) => { if (inp.name) data[inp.name] = inp.value; });
    console.log('[Modal submitted]', data);
    const title = modalTitle.textContent;
    closeModal();
    toast(`${title.replace(/New|Add/g, 'Saved') || 'Action'} completed successfully`);
  });

  // Mobile sidebar
  const sidebar = $('#sidebar'), backdrop = $('#sidebarBackdrop');
  function openSidebar() { sidebar.classList.remove('-translate-x-full'); backdrop.classList.remove('hidden'); }
  function closeSidebar() { sidebar.classList.add('-translate-x-full'); backdrop.classList.add('hidden'); }
  $('#menuBtn').addEventListener('click', openSidebar);
  backdrop.addEventListener('click', closeSidebar);
  $('#logoutBtn').addEventListener('click', () => toast('Signed out (demo)'));

  /* ================================================================
     BOOT
     ================================================================ */
  renderView('dashboard');
  </script>
</body>
</html>

    /* Global font family — Inter for everything */

    /* Blurred backdrop for modals */

    /* Toast slide-in / slide-out animations (bottom-right) */
    .toast-enter { animation: toast-in 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

  <script>
    /* ================================================================
       HELPER: lightweight DOM builder
       el(tag, attrs, children) -> HTMLElement
       Recursively flattens nested arrays so callers can pass rows of
       cells (array-of-arrays) without worrying about nesting depth.
       ================================================================ */
    const el = (tag, attrs = {}, children = []) => {
      const node = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === 'class') node.className = v;
        else if (k === 'html') node.innerHTML = v;
        else if (v !== null && v !== undefined) node.setAttribute(k, v);
      }
      const walk = (items) => {
        for (const c of items) {
          if (c == null) continue;
          if (Array.isArray(c)) { walk(c); continue; }
          node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
        }
      };
      walk(children);
      return node;
    };

    /* Tiny query selector shortcut */
    const $ = (sel, root = document) => root.querySelector(sel);

    /* ================================================================
       API LAYER — wired to the admin backend (admin-server.js)
       Same-origin when served by the admin server; otherwise the dev
       server at http://localhost:4001 (used when opened via file://).
       ================================================================ */
    const API_BASE = location.protocol === 'file:'
      ? (localStorage.getItem('osc_api_base') || 'http://localhost:4001')
      : '';
    const TOKEN_KEY = 'osc_token';
    let modalMode = null;
    let blogEditId = null;

    async function apiFetch(path, opts = {}) {
      const headers = { ...(opts.headers || {}) };
      const token = localStorage.getItem(TOKEN_KEY);
      if (token) headers['Authorization'] = 'Bearer ' + token;
      if (opts.body) headers['Content-Type'] = 'application/json';
      const url = /^https?:\/\//.test(path) ? path : API_BASE + path;
      const res = await fetch(url, {
        ...opts,
        headers,
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        if ((res.status === 401 || res.status === 403) && opts.method !== 'GET') showLoginModal();
        throw new Error(data.error || 'Request failed');
      }
      return data;
    }

    /* Parse SVG markup in the correct SVG namespace (via <template>)
       so <path>/<circle>/<line> render as siblings, not nested HTML. */
    function svgIcon(markup, cls = 'h-5 w-5 text-blue-600') {
      const tpl = document.createElement('template');
      tpl.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg">' + markup + '</svg>';
      const svg = tpl.content.firstChild;
      svg.setAttribute('class', cls);
      svg.setAttribute('fill', 'none');
      svg.setAttribute('viewBox', '0 0 24 24');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '1.8');
      return svg;
    }

    /* ================================================================
       STATUS PILLS (colored badges)
       ================================================================ */
    const pill = (label, cls) =>
      el('span', { class: `inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${cls}` }, [label]);

    // Client lead status
    const clientStatus = {
      Contacted: 'bg-blue-100 text-blue-700',
      New: 'bg-slate-100 text-slate-700',
    };
    // Cleaner application status
    const cleanerStatus = {
      'Under Review': 'bg-amber-100 text-amber-700',
      Approved: 'bg-blue-100 text-blue-700',
      Rejected: 'bg-rose-100 text-rose-700',
    };
    // Investor interest level
    const interest = {
      High: 'bg-rose-100 text-rose-700',
      Medium: 'bg-amber-100 text-amber-700',
      Low: 'bg-slate-100 text-slate-600',
    };
    // Admin role
    const rolePill = {
      'Super Admin': 'bg-rose-100 text-rose-700',
      'Editor': 'bg-blue-100 text-blue-700',
    };

    /* ================================================================
       MOCK DATA (3-4 realistic records per table)
       ================================================================ */
    const clients = [
      { name: 'Sarah Johnson', email: 'sarah.j@example.com', city: 'Austin, TX', date: '2026-09-10', status: 'New' },
      { name: 'Marcus Lee', email: 'marcus.lee@example.com', city: 'Round Rock, TX', date: '2026-09-09', status: 'Contacted' },
      { name: 'Priya Nair', email: 'priya.nair@example.com', city: 'Pflugerville, TX', date: '2026-09-08', status: 'New' },
      { name: 'David Okafor', email: 'david.ok@example.com', city: 'Cedar Park, TX', date: '2026-09-07', status: 'Contacted' },
    ];

    const cleaners = [
      { name: 'James Wilson', email: 'james@wilsoncleaning.com', service: 'Deep Cleaning', status: 'Approved' },
      { name: 'Elena Rodriguez', email: 'elena@solo.com', service: 'Standard Cleaning', status: 'Under Review' },
      { name: 'Tom Nguyen', email: 'tom@nguyensons.com', service: 'Office Cleaning', status: 'Under Review' },
      { name: 'Aisha Khan', email: 'aisha@solo.com', service: 'Carpet Cleaning', status: 'Rejected' },
    ];

    const investors = [
      { name: 'GreenLeaf Capital', email: 'partners@greenleaf.vc', org: 'GreenLeaf Capital', interest: 'High' },
      { name: 'Austin Ventures', email: 'deal@austinvc.com', org: 'Austin Ventures', interest: 'Medium' },
      { name: 'Sarah Mitchell', email: 'sarah.m@angel.io', org: 'Independent', interest: 'Low' },

    // Note: `announcements`, `legalContent`, and `adminUsers` are populated

    /* ================================================================

       ================================================================ */

      dashboard:        { title: 'Dashboard',        subtitle: 'Welcome back — here\'s your startup at a glance.' },

    /* ================================================================

      // Highlight active sidebar item

        b.classList.toggle('nav-active', b.dataset.panel === name);
      });

      // Map panel name -> render function, then render into #view
      const renderers = {
        'dashboard': renderDashboard,
        'crm-clients': renderClients,
        'crm-cleaners': renderCleaners,
        'crm-investors': renderInvestors,
        'cms-announcements': renderAnnouncements,
        'cms-legal': renderLegal,
        'cms-blog': renderBlog,

      // Load live stats
      try {

    /* Build the monochromatic blue line chart */
    function initWaitlistChart() {
      const ctx = document.getElementById('waitlistChart').getContext('2d');

            label: 'Signups',

            backgroundColor: gradient,
            borderWidth: 2.5,
            pointBackgroundColor: '#2563eb',
            pointBorderColor: '#fff',
            pointBorderWidth: 2,
            pointRadius: 3,
            pointHoverRadius: 5,
            fill: true,
            tension: 0.35,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#94a3b8', font: { size: 11 } } },

    /* ================================================================
       VIEW: CMS — LEGAL PAGES
       Simple text editor interface with a Publish button.
       Data loaded from /api/cms/legal, saved via PUT.
       ================================================================ */
    let legalContent = {};
    async function renderLegal() {
      const view = $('#view');
      view.innerHTML = '';
      const card = el('div', { class: 'space-y-6' });

      try {
        const pages = await apiFetch('/api/cms/legal');
        legalContent = {};
        for (const page of pages) {
          legalContent[page.key] = page.body;
          card.appendChild(buildLegalBlock(page));
        }
        if (!pages.length) {
          card.appendChild(el('div', { class: 'bg-white rounded-xl shadow-sm border border-slate-100 p-8 text-center text-sm text-slate-400' }, ['No legal pages yet.']));
        }
      } catch (e) {
        card.appendChild(errorCard(e));
      }
      view.appendChild(card);

      // Wire up publish buttons
      card.querySelectorAll('[data-legal]').forEach((b) => b.addEventListener('click', () => publishLegal(b)));
    }

    function buildLegalBlock(page) {
      const block = el('div', { class: 'bg-white rounded-xl shadow-sm border border-slate-100' });
      block.appendChild(el('div', { class: 'px-6 py-4 border-b border-slate-100 flex items-center justify-between' }, [
        el('h2', { class: 'text-base font-semibold text-slate-800' }, [page.title || page.key]),
        el('button', { class: 'px-3 py-2 rounded-lg text-sm font-medium text-white bg-blue-600 hover:bg-blue-700', 'data-legal': page.key }, ['Publish Changes']),
      ]));

      const editor = el('div', { class: 'px-6 py-4' });
      editor.appendChild(el('textarea', {
        class: 'w-full h-56 px-4 py-3 text-sm rounded-lg border border-slate-200 bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 resize-none',
        'data-legal-body': page.key,
      }, [page.body]));
      block.appendChild(editor);
      return block;
    }

    async function publishLegal(btn) {
      const key = btn.dataset.legal;
      const textarea = $(`[data-legal-body="${key}"]`);
      if (!textarea) return;
      const body = textarea.value;
      try {
        await apiFetch(`/api/cms/legal/${encodeURIComponent(key)}`, { method: 'PUT', body: { body } });
        toast(`${key} published successfully`);
      } catch (e) {
        toast(e.message);
      }
    }

    /* ================================================================
       VIEW: CMS — BLOG (wired to backend /api/blog)
       ================================================================ */
    let blogPosts = [];
    let blogFilter = 'all';
    let blogCard = null;

    function statusPill(status) {
      const map = { published: 'bg-emerald-100 text-emerald-700', draft: 'bg-slate-100 text-slate-600' };
      return pill(status, map[status] || 'bg-slate-100 text-slate-600');
    }

    async function renderBlog() {
      const view = $('#view');
      view.innerHTML = '';

      const header = el('div', { class: 'flex flex-wrap items-center justify-between gap-3 mb-6' }, [
        el('h2', { class: 'text-base font-semibold text-slate-800' }, ['Blog Posts']),
        el('button', { 'data-create': 'blog', class: 'inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium text-white bg-blue-600 hover:bg-blue-700' }, [
          svgIcon('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', 'h-4 w-4'),
          'New Post',
        ]),
      ]);
      view.appendChild(header);

      const filterBar = el('div', { class: 'flex flex-wrap items-center gap-2 mb-4' });
      for (const f of ['all', 'published', 'draft']) {
        filterBar.appendChild(el('button', {
          'data-filter': f,
          class: `px-3 py-1.5 rounded-lg text-sm font-medium ${blogFilter === f ? 'tab-active' : 'tab-inactive'}`,
        }, [f.charAt(0).toUpperCase() + f.slice(1)]));
      }
      filterBar.querySelectorAll('[data-filter]').forEach((b) => b.addEventListener('click', () => {
        blogFilter = b.dataset.filter;
        if (blogCard) renderBlogTable(blogCard);
      }));
      view.appendChild(filterBar);

      blogCard = el('div', { class: 'bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden' });
      view.appendChild(blogCard);

      await loadBlog(blogCard);

    async function loadBlog(card) {
      card.innerHTML = '';
      card.appendChild(el('div', { class: 'p-8 text-center text-sm text-slate-400' }, ['Loading posts…']));
      try {
        blogPosts = await apiFetch('/api/blog');
      } catch (e) {
        card.innerHTML = '';
        card.appendChild(el('div', { class: 'p-8 text-center text-sm text-slate-500' }, [
          el('p', { class: 'font-medium' }, [e.message]),
          el('button', { id: 'blogSignInBtn', class: 'mt-3 inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium text-white bg-blue-600 hover:bg-blue-700' }, ['Sign in']),
          el('p', { class: 'text-xs text-slate-400 mt-2' }, ['Manage blog posts requires an admin account.']),
        ]));
        const sb = document.getElementById('blogSignInBtn');
        if (sb) sb.addEventListener('click', showLoginModal);
        return;
      }
      renderBlogTable(card);
    }

    function renderBlogTable(card) {
      card.innerHTML = '';
      const rows = blogPosts
        .filter((p) => blogFilter === 'all' || p.status === blogFilter)
        .map((p) => [
          el('td', { class: 'px-6 py-4 font-medium text-slate-800' }, [p.title]),
          el('td', { class: 'px-6 py-4 text-slate-500' }, [p.author || '—']),
          el('td', { class: 'px-6 py-4 text-slate-500' }, [p.category || 'news']),
          el('td', { class: 'px-6 py-4' }, [statusPill(p.status)]),
          el('td', { class: 'px-6 py-4 text-slate-500 whitespace-nowrap' }, [p.created_at ? new Date(p.created_at).toLocaleDateString() : '—']),
          el('td', { class: 'px-6 py-4 text-right whitespace-nowrap' }, [
            el('button', { 'data-edit-blog': p.id, class: 'text-sm font-medium text-blue-600 hover:text-blue-700 mr-3' }, ['Edit']),
            el('button', { 'data-delete-blog': p.id, class: 'text-sm font-medium text-rose-600 hover:text-rose-700' }, ['Delete']),
          ]),
        ]);
      card.appendChild(el('table', { class: 'w-full text-sm' }, [
        el('thead', {}, [el('tr', { class: 'text-xs uppercase tracking-wider text-slate-500 bg-slate-50' }, [
          el('th', { class: 'px-6 py-3 text-left font-semibold' }, ['Title']),
          el('th', { class: 'px-6 py-3 text-left font-semibold' }, ['Author']),
          el('th', { class: 'px-6 py-3 text-left font-semibold' }, ['Category']),
          el('th', { class: 'px-6 py-3 text-left font-semibold' }, ['Status']),
          el('th', { class: 'px-6 py-3 text-left font-semibold' }, ['Created']),
          el('th', { class: 'px-6 py-3 text-right font-semibold' }, ['']),
        ])]),
        el('tbody', { class: 'divide-y divide-slate-100' }, rows.length ? rows : [
          [el('td', { class: 'px-6 py-8 text-center text-slate-400 col-span-6' }, ['No blog posts yet.'])],
        ]),
      ]));
      card.querySelectorAll('[data-delete-blog]').forEach((b) => b.addEventListener('click', () => deleteBlogPost(Number(b.dataset.deleteBlog))));
      card.querySelectorAll('[data-edit-blog]').forEach((b) => b.addEventListener('click', () => openBlogModal(Number(b.dataset.editBlog))));
    }

    async function deleteBlogPost(id) {
      if (!confirm('Delete this blog post? This cannot be undone.')) return;
      try {
        await apiFetch(`/api/blog/${id}`, { method: 'DELETE' });
        toast('Post deleted');
        if (blogCard) await loadBlog(blogCard);
      } catch (e) { toast(e.message); }
    }

    function openBlogModal(id) {
      blogEditId = id;
      modalMode = 'blog';
      const post = id ? blogPosts.find((p) => p.id === id) : null;
      const overlay = $('#modalOverlay');
      $('#modalTitle').textContent = post ? 'Edit Post' : 'New Blog Post';
      const form = $('#modalForm');
      form.innerHTML = '';
      $('#modalSubmit').textContent = post ? 'Save changes' : 'Create post';

      const fields = [
        { name: 'title', label: 'Title', type: 'text', required: true },
        { name: 'slug', label: 'Slug (optional)', type: 'text' },
        { name: 'author', label: 'Author', type: 'text' },
        { name: 'category', label: 'Category', type: 'select', options: ['Launch', 'Guide', 'News'] },
        { name: 'cover_url', label: 'Cover image URL', type: 'text' },
        { name: 'excerpt', label: 'Excerpt', type: 'textarea' },
        { name: 'body', label: 'Body', type: 'textarea', rows: 6 },
        { name: 'status', label: 'Status', type: 'select', options: ['draft', 'published'] },
      ];
      for (const f of fields) {
        const label = el('label', { class: 'block text-sm font-medium text-slate-700 mb-1' }, [f.label]);
        let input;
        if (f.type === 'textarea') {
          input = el('textarea', { name: f.name, rows: String(f.rows || 4), class: 'w-full px-3 py-2 text-sm rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 resize-none' }, [post ? (post[f.name] || '') : '']);
        } else if (f.type === 'select') {
          input = el('select', { name: f.name, class: 'w-full px-3 py-2 text-sm rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600' }, f.options.map((o) => el('option', { value: o }, [o])));
          if (post && post[f.name] !== undefined) input.value = post[f.name];
        } else if (f.name === 'cover_url') {
          // Cover image field with an upload button.
          const wrap = el('div', { class: 'space-y-1' });
          input = el('input', { name: f.name, type: f.type, class: 'w-full px-3 py-2 text-sm rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600', placeholder: 'https://… or upload a photo below' });
          if (post) input.value = post.cover_url || '';
          const row = el('div', { class: 'flex gap-2' });
          const uploadBtn = el('button', { type: 'button', class: 'inline-flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium text-slate-700 bg-slate-100 hover:bg-slate-200 whitespace-nowrap' }, [
            svgIcon('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>', 'h-4 w-4'),
            'Upload photo',
          ]);
          uploadBtn.addEventListener('click', async () => {
            const picker = document.createElement('input');
            picker.type = 'file';
            picker.accept = 'image/*';
            picker.addEventListener('change', async () => {
              const file = picker.files && picker.files[0];
              if (!file) return;
              const fd = new FormData();
              fd.append('image', file);
              try {
                const res = await apiFetch('/api/blog/upload', { method: 'POST', body: fd });
                if (res && res.url) {
                  input.value = res.url;
                  toast('Image uploaded');
                }
              } catch (e) { toast(e.message); }
            });
            picker.click();
          });
          row.appendChild(input);
          row.appendChild(uploadBtn);
          wrap.appendChild(row);
          form.appendChild(wrap);
          continue;
        } else {
          input = el('input', { name: f.name, type: f.type, class: 'w-full px-3 py-2 text-sm rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600' });
          if (post) input.value = post[f.name] || '';
        }
        form.appendChild(el('div', {}, [label, input]));
      }
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    async function submitBlog(data, id) {
      try {
        if (id) await apiFetch(`/api/blog/${id}`, { method: 'PUT', body: data });
        else await apiFetch('/api/blog', { method: 'POST', body: data });
        toast(id ? 'Post updated' : 'Post created');
        closeModal();
        if (blogCard) await loadBlog(blogCard);
      } catch (e) { toast(e.message); }
    }

    /* ---- Auth: sign-in modal ---- */
    function showLoginModal() {
      modalMode = 'login';
      const overlay = $('#modalOverlay');
      $('#modalTitle').textContent = 'Sign in';
      const form = $('#modalForm');
      form.innerHTML = '';
      $('#modalSubmit').textContent = 'Sign in';

      const email = el('input', { name: 'email', type: 'email', placeholder: 'you@example.com', class: 'w-full px-3 py-2 text-sm rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600' });
      const password = el('input', { name: 'password', type: 'password', placeholder: '••••••••', class: 'w-full px-3 py-2 text-sm rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600' });
      form.appendChild(el('div', { class: 'space-y-1 mb-4' }, [el('label', { class: 'block text-sm font-medium text-slate-700' }, ['Email']), email]));
      form.appendChild(el('div', { class: 'space-y-1 mb-4' }, [el('label', { class: 'block text-sm font-medium text-slate-700' }, ['Password']), password]));
      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    async function doLogin(data) {
      try {
        const res = await apiFetch('/api/auth/login', { method: 'POST', body: { email: data.email, password: data.password } });
        localStorage.setItem(TOKEN_KEY, res.token);
        closeModal();
        toast('Signed in');
        if ($('#viewTitle').textContent === 'Blog') await renderBlog();
      } catch (e) { toast(e.message); }
    }

    /* ================================================================
       VIEW: SETTINGS — ADMIN USERS (RBAC)
       Data loaded from /api/auth, deletes via DELETE /api/auth/:id.
       ================================================================ */
    let adminUsers = [];
    async function renderUsers() {
      const view = $('#view');
      view.innerHTML = '';

      // Invite button
      const header = el('div', { class: 'flex items-center justify-between mb-6' }, [
        el('h2', { class: 'text-base font-semibold text-slate-800' }, ['Admin Users']),
        el('button', { 'data-create': 'user', class: 'inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium text-white bg-blue-600 hover:bg-blue-700' }, [
          svgIcon('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', 'h-4 w-4'),
          'Invite New Admin',
        ]),
      ]);
      view.appendChild(header);

      try {
        adminUsers = await apiFetch('/api/auth');
        view.appendChild(renderUsersTable(adminUsers));
      } catch (e) {
        view.appendChild(errorCard(e));
      }
    }

    function renderUsersTable(users) {
      return renderTable({
        columns: ['User', 'Email', 'Role', 'Last Login', ''],
        rows: users.map((u) => [
          el('td', { class: 'px-6 py-4' }, [
            el('span', { class: 'inline-flex items-center gap-3' }, [
              el('span', { class: 'h-8 w-8 rounded-full bg-blue-600 grid place-items-center text-white text-xs font-semibold' }, [u.name ? u.name[0] : 'U']),
              el('span', { class: 'font-medium text-slate-800' }, [u.name || '—']),
            ]),
          ]),
          el('td', { class: 'px-6 py-4 text-slate-500' }, [u.email || '—']),
          el('td', { class: 'px-6 py-4' }, [pill(u.role, rolePill[u.role] || 'bg-slate-100 text-slate-600')]),
          el('td', { class: 'px-6 py-4 text-slate-500' }, [u.created_at ? new Date(u.created_at).toLocaleDateString() : '—']),
          el('td', { class: 'px-6 py-4 text-right' }, [
            u.role !== 'superadmin'
              ? el('button', { 'data-delete-user': u.id, class: 'text-sm font-medium text-rose-600 hover:text-rose-700' }, ['Remove'])
              : null,
          ]),
        ]),
      });
    }

    /* ================================================================
       MODAL SYSTEM (centralized, blurred backdrop)
       ================================================================ */
    const formSchemas = {
      // New announcement form (fields map to the /api/cms/announcements schema)
      announcement: {
        title: 'New Announcement',
        fields: [
          { name: 'title', label: 'Title', type: 'text', required: true },
          { name: 'body', label: 'Message', type: 'textarea', required: true },
          { name: 'style', label: 'Style', type: 'select', options: ['Banner', 'Modal Popup', 'Info'] },
        ],
      },
      // New admin user form
      user: {
        title: 'Invite New Admin',
        fields: [
          { name: 'name', label: 'Full Name', type: 'text', required: true },
          { name: 'email', label: 'Email', type: 'email', required: true },
          { name: 'password', label: 'Temporary Password', type: 'text', required: true },
          { name: 'role', label: 'Role', type: 'select', options: ['Super Admin', 'Editor'] },
        ],
      },
    };

    // Open a modal from a schema. Optional `prefill` fills existing values and
    // `mode` sets the submit dispatch target (defaults to a generic update).
    function openModal(schema, prefill = {}, mode = 'update') {
      const overlay = $('#modalOverlay');
      $('#modalTitle').textContent = schema.title;
      const form = $('#modalForm');
      form.innerHTML = '';
      modalMode = mode;

      for (const f of schema.fields) {
        const label = el('label', { class: 'block text-sm font-medium text-slate-700 mb-1' }, [f.label]);
        let input;
        if (f.type === 'textarea') {
          input = el('textarea', { name: f.name, rows: '4', class: 'w-full px-3 py-2 text-sm rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600 resize-none', required: f.required ? '' : null }, [prefill[f.name] || '']);
        } else {
          input = el('input', { name: f.name, type: f.type, class: 'w-full px-3 py-2 text-sm rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-blue-600', required: f.required ? '' : null });
          input.value = prefill[f.name] || '';
        }
        form.appendChild(el('div', {}, [label, input]));
      }

      overlay.classList.remove('hidden');
      overlay.classList.add('flex');
    }

    // Close the modal
    function closeModal() {
      const overlay = $('#modalOverlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
      $('#modalForm').reset();
      modalMode = null;
      blogEditId = null;
      announcementEditId = null;
    }

    /* ================================================================
       TOAST NOTIFICATION (bottom-right, blue box)
       ================================================================ */
    let toastTimer = null;
    function toast(message) {
      const toastEl = $('#toast');
      $('#toastMsg').textContent = message;
      toastEl.classList.remove('hidden');
      toastEl.classList.remove('toast-exit');
      toastEl.classList.add('flex', 'toast-enter');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.classList.remove('toast-enter');
        toastEl.classList.add('toast-exit');
        setTimeout(() => { toastEl.classList.add('hidden'); toastEl.classList.remove('flex', 'toast-exit'); }, 400);
      }, 3000);
    }

    /* ================================================================
       SIDEBAR (mobile) helpers
       ================================================================ */
    const sidebar = $('#sidebar');
    const backdrop = $('#sidebarBackdrop');
    function openSidebar() { sidebar.classList.remove('-translate-x-full'); backdrop.classList.remove('hidden'); }
    function closeSidebar() { sidebar.classList.add('-translate-x-full'); backdrop.classList.add('hidden'); }

    /* ================================================================
       EVENT WIRING
       ================================================================ */
    // Sidebar navigation
    document.querySelectorAll('.nav-item').forEach((btn) => btn.addEventListener('click', () => renderView(btn.dataset.panel)));

    // Delegated "create" buttons (in-view buttons)
    document.addEventListener('click', (e) => {
      const createBtn = e.target.closest('[data-create]');
      if (createBtn) {
        const key = createBtn.dataset.create;
        if (key === 'blog') { openBlogModal(null); }
        else if (key === 'announcement') {
          announcementEditId = null;
          openModal(formSchemas.announcement, {}, 'announcement');
          setTimeout(() => {
            const submitBtn = $('#modalSubmit');
            if (submitBtn) submitBtn.textContent = 'Create announcement';
          }, 0);
        }
        else if (formSchemas[key]) openModal(formSchemas[key]);
      }
    });

    // Preview buttons (show announcement details in a modal)
    document.addEventListener('click', (e) => {
      const previewBtn = e.target.closest('[data-preview]');
      if (previewBtn) {
        const id = Number(previewBtn.dataset.preview);
        const a = announcements.find((x) => x.id === id);
        if (a) {
          $('#modalTitle').textContent = `Preview: ${a.title}`;
          const form = $('#modalForm');
          form.innerHTML = '';
          form.appendChild(el('div', { class: 'space-y-2 text-sm text-slate-700' }, [
            el('p', {}, [a.body]),
            el('p', { class: 'text-xs text-slate-400' }, [`Style: ${a.style} · Status: ${a.active ? 'Active' : 'Inactive'}`]),
          ]));
          $('#modalOverlay').classList.remove('hidden');
          $('#modalOverlay').classList.add('flex');
        }
      }
    });

    // Edit announcement — open the create modal pre-filled, then save via PUT.
    let announcementEditId = null;
    document.addEventListener('click', (e) => {
      const editBtn = e.target.closest('[data-edit]');
      if (editBtn && editBtn.dataset.edit !== undefined && !editBtn.dataset.editBlog) {
        const id = Number(editBtn.dataset.edit);
        const a = announcements.find((x) => x.id === id);
        if (!a) return;
        announcementEditId = id;
        const schema = formSchemas.announcement;
        openModal(schema, {
          title: a.title,
          body: a.body,
          style: a.style,
        });
        // Rename the submit button while in edit mode.
        const overlay = $('#modalOverlay');
        setTimeout(() => {
          const submitBtn = $('#modalSubmit');
          if (submitBtn) submitBtn.textContent = 'Save changes';
        }, 0);
      }
    });

    // Modal form submit — dispatches based on which modal is open
    $('#modalForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = {};
      $('#modalForm').querySelectorAll('input, select, textarea').forEach((inp) => { if (inp.name) data[inp.name] = inp.value; });
      if (modalMode === 'blog') { await submitBlog(data, blogEditId); return; }
      if (modalMode === 'login') { await doLogin(data); return; }
      if (modalMode === 'user') {
        try {
          await apiFetch('/api/auth/admins', { method: 'POST', body: data });
          toast('Admin invited');
          announcementEditId = null;
          closeModal();
          if ($('#viewTitle').textContent === 'Admin Users') await renderUsers();
        } catch (err) { toast(err.message); }
        return;
      }
      if (modalMode === 'announcement') {
        try {
          if (announcementEditId) {
            await apiFetch(`/api/cms/announcements/${announcementEditId}`, { method: 'PUT', body: data });
            toast('Announcement updated');
          } else {
            await apiFetch('/api/cms/announcements', { method: 'POST', body: data });
            toast('Announcement created');
          }
          announcementEditId = null;
          closeModal();
          if ($('#viewTitle').textContent === 'Announcements') await renderAnnouncements();
        } catch (err) { toast(err.message); }
        return;
      }
      closeModal();
      toast('Updated successfully');
    });

    // Modal controls
    $('#modalClose').addEventListener('click', closeModal);
    $('#modalCancel').addEventListener('click', closeModal);
    $('#modalOverlay').addEventListener('click', (e) => { if (e.target === $('#modalOverlay')) closeModal(); });

    // Delete admin user
    document.addEventListener('click', (e) => {
      const delBtn = e.target.closest('[data-delete-user]');
      if (delBtn) deleteUser(Number(delBtn.dataset.deleteUser));
    });

    async function deleteUser(id) {
      if (!confirm('Remove this admin user? This cannot be undone.')) return;
      try {
        await apiFetch(`/api/auth/${id}`, { method: 'DELETE' });
        toast('User removed');
        if ($('#viewTitle').textContent === 'Admin Users') await renderUsers();
      } catch (err) { toast(err.message); }
    }

    // Mobile sidebar
    $('#menuBtn').addEventListener('click', openSidebar);
    backdrop.addEventListener('click', closeSidebar);

    // Logout — clear the session and return to the login overlay.
    function logout() {
      localStorage.removeItem(TOKEN_KEY);
      // Also clear any stored API base so a fresh origin is used next time.
      localStorage.removeItem('osc_api_base');
      const overlay = $('#loginOverlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
      $('#loginForm').reset();
      const err = $('#loginError');
      if (err) err.classList.add('hidden');
      renderView('dashboard');
    }
    $('#logoutBtn').addEventListener('click', logout);

    /* ================================================================
       LOGIN FLOW — authenticate against /api/auth/login
       ================================================================ */
    const loginForm = $('#loginForm');
    const loginOverlay = $('#loginOverlay');
    const loginError = $('#loginError');

    function showLoginError(message) {
      if (!loginError) return;
      loginError.textContent = message || 'Invalid email or password.';
      loginError.classList.remove('hidden');
    }
    function hideLoginError() {
      if (loginError) loginError.classList.add('hidden');
    }

    if (loginForm) {
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        hideLoginError();
        const email = loginForm.querySelector('[name="email"]').value.trim();
        const password = loginForm.querySelector('[name="password"]').value;
        try {
          const res = await apiFetch('/api/auth/login', {
            method: 'POST',
            body: { email, password },
          });
          localStorage.setItem(TOKEN_KEY, res.token);
          hideLoginError();
          hideLogin();
          renderView('dashboard');
        } catch (e) {
          showLoginError(e.message);
        }
      });
    }

    /* ================================================================
       PROFILE SECTION — populate from the authenticated user
       ================================================================ */
    function renderProfile(user) {
      const avatar = sidebar.querySelector('.profile-avatar');
      const nameEl = sidebar.querySelector('.profile-name');
      const emailEl = sidebar.querySelector('.profile-email');
      if (avatar) {
        avatar.textContent = (user.name && user.name[0] || 'U').toUpperCase();
      }
      if (nameEl) nameEl.textContent = user.name || 'Admin User';
      if (emailEl) emailEl.textContent = user.email || '';
    }

    /* ================================================================
       AUTH GATE — verify the session before showing the app.
       ================================================================ */
    function showLogin() { loginOverlay.classList.remove('hidden'); loginOverlay.classList.add('flex'); }
    function hideLogin() { loginOverlay.classList.add('hidden'); loginOverlay.classList.remove('flex'); }

    async function boot() {
      const token = localStorage.getItem(TOKEN_KEY);
      if (!token) { showLogin(); return; }
      try {
        const user = await apiFetch('/api/auth/me');
        renderProfile(user);
        hideLogin();
        renderView('dashboard');
      } catch (e) {
        localStorage.removeItem(TOKEN_KEY);
        showLogin();
      }
    }

    boot();
  </script>
</body>
</html>

name = "one-stop-cleaner"
main = "worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# esbuild alias: replace iconv-lite (pulled in transitively by express →
# body-parser → raw-body) with an empty stub. iconv-lite's Node stream code
# breaks on the Workers runtime, and our JSON-only API never uses it.
[alias]
"iconv-lite" = "./empty-iconv.js"

# Static assets: the marketing site + admin dashboard.
# not_found_handling = "single-page-application" makes unknown routes fall
# back to index.html so the SPA router works.
# run_worker_first = ["/api/*"] routes API calls through the worker (Express)
# before the assets fallback.
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# D1 database (Cloudflare's managed SQLite).
[[d1_databases]]
binding = "one_stop_cleaner_db"
database_id = "e3a0eeda-3868-40e4-8f45-1ea4e00dce97"
database_name = "one-stop-cleaner-db"
